laravel: '@testbench'

providers:
  - Livewire\LivewireServiceProvider
  - Corepine\Modal\ModalServiceProvider

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: false
    commands: true
    components: false
    factories: false
    views: true
  build:
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
